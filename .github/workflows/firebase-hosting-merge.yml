name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Injects environment variables for the production Vite build:
      # Option B (Recommended): Cloudflare Worker proxy URL (public URL)
      # Option A (Fallback): Direct Resend API key (secret)
      - name: Build frontend
        run: npm ci && npm run build
        env:
          CONTACT_PROXY_URL: ${{ vars.CONTACT_PROXY_URL || secrets.CONTACT_PROXY_URL }}
          VITE_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KSHIRSATECHSOLUTIONS }}
          channelId: live
          projectId: kshirsatechsolutions
