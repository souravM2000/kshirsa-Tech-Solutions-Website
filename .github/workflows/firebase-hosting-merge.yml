name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Inspect and log the Cloudflare Worker URL from GitHub Secrets/Variables
      - name: Check Environment Variables & Create .env.production
        env:
          RESOLVED_PROXY_URL: ${{ vars.VITE_CONTACT_PROXY_URL || vars.CONTACT_PROXY_URL || secrets.VITE_CONTACT_PROXY_URL || secrets.CONTACT_PROXY_URL }}
        run: |
          echo "=========================================="
          echo "GITHUB ACTIONS BUILD ENVIRONMENT CHECK"
          echo "=========================================="
          if [ -z "$RESOLVED_PROXY_URL" ]; then
            echo "❌ ERROR: No Cloudflare Worker URL found!"
            echo "Please add CONTACT_PROXY_URL or VITE_CONTACT_PROXY_URL in GitHub Repository Settings -> Variables or Secrets."
          else
            echo "✅ SUCCESS: Found Cloudflare Worker Proxy URL!"
            # Show first 20 characters for verification without leaking full secret if sensitive
            echo "Proxy URL preview: ${RESOLVED_PROXY_URL:0:30}..."
            echo "URL character length: ${#RESOLVED_PROXY_URL}"
          fi
          echo "Writing VITE_CONTACT_PROXY_URL to .env.production for Vite build..."
          echo "VITE_CONTACT_PROXY_URL=$RESOLVED_PROXY_URL" > .env.production
          echo "=========================================="

      # Build frontend with Vite using the created .env.production
      - name: Build frontend
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KSHIRSATECHSOLUTIONS }}
          channelId: live
          projectId: kshirsatechsolutions
