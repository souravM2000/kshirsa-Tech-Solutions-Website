name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Maps either CONTACT_PROXY_URL or VITE_CONTACT_PROXY_URL to Vite's build environment
      - name: Build frontend
        run: npm ci && npm run build
        env:
          VITE_CONTACT_PROXY_URL: ${{ vars.VITE_CONTACT_PROXY_URL || vars.CONTACT_PROXY_URL || secrets.VITE_CONTACT_PROXY_URL || secrets.CONTACT_PROXY_URL }}
          VITE_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KSHIRSATECHSOLUTIONS }}
          channelId: live
          projectId: kshirsatechsolutions
