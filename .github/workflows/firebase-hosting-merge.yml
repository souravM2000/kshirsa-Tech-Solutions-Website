name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RESEND_API_KEY is stored as a GitHub Secret (never committed to git).
      # Vite compiles VITE_* env vars into the bundle at build time.
      # Add it in: GitHub → Repo → Settings → Secrets and variables → Actions → New repository secret
      - name: Build frontend
        run: npm ci && npm run build
        env:
          VITE_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KSHIRSATECHSOLUTIONS }}
          channelId: live
          projectId: kshirsatechsolutions
